name: Run 011 Live U.S. Website Opportunity Census

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [master]
    paths:
      - 'api/run011-inference.js'
      - 'agent-factory/run-011/**'
      - 'agent-factory/governance/a0-decisions/A0-OUCS-011-EXEC-001.a0.json'
      - '.github/workflows/run-011-opportunity-census.yml'

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: run-011-live-opportunity-census
  cancel-in-progress: false

jobs:
  opportunity-census:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out governed code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Run 011 executor
        run: |
          node --check api/run011-inference.js
          node --check agent-factory/run-011/runtime/live-opportunity-census.cjs
          node --test agent-factory/run-011/tests/*.test.cjs

      - name: Load durable census state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin run011-live-evidence || true
          if git show origin/run011-live-evidence:agent-factory/run-011/evidence/live-census/state.json > /tmp/run011-prior-state.json 2>/dev/null; then
            echo "Loaded prior Run 011 state."
          else
            printf '{"schemaVersion":"1.0","missionId":"US-WEB-OPPORTUNITY-CENSUS-001","runCount":0,"candidates":[],"coverage":{},"updatedAt":null}\n' > /tmp/run011-prior-state.json
            echo "No prior Run 011 state; starting initial census."
          fi

      - name: Mint repository-bound GitHub OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=run011-vercel-inference"
          TOKEN_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$REQUEST_URL")
          TOKEN=$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(0,"utf8")); if(!x.value) process.exit(2); process.stdout.write(x.value);' <<< "$TOKEN_JSON")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Wait for Run 011 inference endpoint deployment
        shell: bash
        run: |
          set -euo pipefail
          URL="https://datascout-live-sourcing-preview.vercel.app/api/run011-inference"
          for attempt in $(seq 1 24); do
            code=$(curl -sS -o /tmp/run011-probe.txt -w "%{http_code}" -X POST "$URL" || true)
            if [ "$code" != "404" ] && [ "$code" != "000" ]; then
              echo "Inference endpoint reachable with HTTP $code."
              exit 0
            fi
            sleep 10
          done
          echo "Run 011 inference endpoint did not become reachable." >&2
          exit 1

      - name: Execute source to analyst to reviewer census batch
        id: execute
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN011_BRIDGE_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN011_INFERENCE_BRIDGE_URL: https://datascout-live-sourcing-preview.vercel.app/api/run011-inference
          RUN011_TERRITORIES_PER_RUN: '6'
          RUN011_BRIDGE_ATTEMPTS: '8'
        run: |
          node agent-factory/run-011/runtime/live-opportunity-census.cjs \
            --state=/tmp/run011-prior-state.json \
            --state-output=/tmp/run011-state.json \
            --output=/tmp/run011-census.json

      - name: Upload immutable execution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run011-opportunity-census-${{ github.run_id }}
          path: /tmp/run011-census.json
          if-no-files-found: error
          retention-days: 30

      - name: Independent packet acceptance checks
        id: acceptance
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const packet = JSON.parse(fs.readFileSync('/tmp/run011-census.json', 'utf8'));
          if (packet.terminalState !== 'DELIVERED') throw new Error(\`terminal state ${packet.terminalState}\`);
          if (packet.qa?.status !== 'PASS') throw new Error(\`QA ${packet.qa?.status}\`);
          if (packet.execution?.provider !== 'vercel-ai-gateway-oidc') throw new Error('unexpected inference provider');
          if (packet.execution?.separateInferenceCalls !== true) throw new Error('analyst/reviewer calls not isolated');
          if (packet.execution?.separateModels !== true) throw new Error('analyst/reviewer models not distinct');
          if (packet.execution?.zeroSpendModelGate !== true || packet.qa?.zeroSpendReceiptsVerified !== true) throw new Error('zero-spend gate failed');
          if (packet.execution?.spendAuthorized !== false || packet.execution?.spendCentsClaimed !== 0) throw new Error('spend authority expanded');
          if (packet.execution?.outreachAuthorized !== false || packet.execution?.purchasingAuthorized !== false || packet.execution?.publicationAuthorized !== false) throw new Error('external authority expanded');
          if (packet.qa?.evidenceUrlsInvalid !== 0) throw new Error('invalid evidence URL reached persistence');
          console.log(JSON.stringify({status:'PASS', totals:packet.totals, nextAction:packet.nextAction}));
          NODE

      - name: Persist census evidence and state
        if: steps.acceptance.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin run011-live-evidence || true
          if git show-ref --verify --quiet refs/remotes/origin/run011-live-evidence; then
            git checkout -B run011-live-evidence origin/run011-live-evidence
          else
            git checkout -B run011-live-evidence
          fi
          mkdir -p agent-factory/run-011/evidence/live-census/history
          cp /tmp/run011-census.json agent-factory/run-011/evidence/live-census/latest.json
          cp /tmp/run011-state.json agent-factory/run-011/evidence/live-census/state.json
          cp /tmp/run011-census.json "agent-factory/run-011/evidence/live-census/history/${GITHUB_RUN_ID}.json"

          git config user.name "run011-opportunity-bot"
          git config user.email "run011-opportunity-bot@users.noreply.github.com"
          git add agent-factory/run-011/evidence/live-census
          if git diff --cached --quiet; then
            echo "No persistence delta."
          else
            git commit -m "chore(run011): persist opportunity census ${GITHUB_RUN_ID}"
            git push origin HEAD:run011-live-evidence
          fi

      - name: Post Work Control progress receipt
        if: steps.acceptance.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - <<'NODE' > /tmp/run011-comment.md
          const p=require('/tmp/run011-census.json');
          const d=p.totals.dispositions;
          console.log('## Run 011 execution receipt');
          console.log('');
          console.log(\`**Lifecycle:** RUNNING  \`);
          console.log(\`**Owner:** Agent 000  \`);
          console.log(\`**Execution:** GitHub Actions → public-source acquisition → Opportunity Analyst → independent Reviewer → durable evidence  \`);
          console.log(\`**Distinct candidates persisted:** ${p.totals.distinctCandidates}  \`);
          console.log(\`**Territories:** ${p.totals.territoriesProcessed}/${p.totals.territoriesTotal} processed; ${p.totals.territoriesRemaining} remaining; ${p.totals.territoriesBlocked} blocked  \`);
          console.log(\`**Dispositions:** ADVANCE ${d.ADVANCE} · WATCH ${d.WATCH} · DEFER ${d.DEFER} · KILL ${d.KILL} · BLOCKED_EVIDENCE ${d.BLOCKED_EVIDENCE}  \`);
          console.log(\`**QA:** ${p.qa.status}; zero-spend inference gate ${p.qa.zeroSpendReceiptsVerified?'PASS':'FAIL'}  \`);
          console.log(\`**Next action:** ${p.nextAction}\`);
          console.log('');
          console.log(\`Evidence run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\`);
          NODE
          gh issue comment 110 --repo "${{ github.repository }}" --body-file /tmp/run011-comment.md

      - name: Fail workflow if execution or acceptance failed
        if: steps.execute.outcome != 'success' || steps.acceptance.outcome != 'success'
        run: |
          echo "Run 011 live execution or acceptance failed." >&2
          exit 1
