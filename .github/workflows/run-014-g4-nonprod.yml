name: Run 014 G4 Non-Production Proving Assignment

on:
  pull_request:
    paths:
      - 'agent-factory/run-014/**'
      - 'agent-factory/governance/a0-decisions/A0-SOFT-014-G4-001.a0.json'
      - '.github/workflows/run-014-g4-nonprod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Execute Run 014 G4 proving assignment
        run: |
          rm -rf /tmp/run014-g4-ci
          node agent-factory/run-014/runtime/g4-runner.cjs \
            --brief agent-factory/run-014/g4/product-brief.json \
            --out /tmp/run014-g4-ci
      - name: Verify terminal receipt
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/run014-g4-ci/08-g4-receipt.json','utf8'));
          if(r.decision!=='PASS') throw new Error('G4 did not PASS');
          if(r.externalActionsPerformed!==0 || r.spendCents!==0 || r.deploymentsPerformed!==0) throw new Error('authority violation');
          if(!r.checks || !Object.values(r.checks).every(Boolean)) throw new Error('QA checks incomplete');
          console.log(JSON.stringify(r,null,2));
          NODE
      - name: Verify generated release candidate is static and dependency-free
        run: |
          test -f /tmp/run014-g4-ci/release-candidate/index.html
          test -f /tmp/run014-g4-ci/release-candidate/readiness-core.js
          test -f /tmp/run014-g4-ci/07-ops-handoff.json
          ! grep -R -E 'https?://' /tmp/run014-g4-ci/release-candidate
