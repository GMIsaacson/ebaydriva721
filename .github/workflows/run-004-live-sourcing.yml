name: Run 004 Live Sourcing MVP

on:
  push:
    branches: [codex/run-004-live-sourcing-mvp]
    paths:
      - 'agent-factory/run-004/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/run-004-live-sourcing.yml'
  pull_request:
    paths:
      - 'agent-factory/run-004/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/run-004-live-sourcing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sourcing-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test source access and authorized intake
        run: npm run test:run004:sourcing
      - name: Preserve existing Run 004 G4 tests
        run: npm run test:g4
      - name: Build DataScout
        run: npm run build
