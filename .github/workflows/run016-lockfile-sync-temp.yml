name: Run 016 Lockfile Sync Temp

on:
  push:
    branches: [run016-ai-sdk-gateway-fix]
    paths:
      - 'package.json'
      - '.github/workflows/run016-lockfile-sync-temp.yml'

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run016-ai-sdk-gateway-fix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate canonical package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only
        run: |
          git config user.name "run016-lockfile-bot"
          git config user.email "run016-lockfile-bot@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git commit -m "build(run016): synchronize AI SDK lockfile"
          git push origin HEAD:run016-ai-sdk-gateway-fix
