name: Run 009 D0 Permit Intelligence Handoff

on:
  pull_request:
    paths:
      - 'agent-factory/run-009/**'
      - 'agent-factory/run-008/runtime/runtime.cjs'
      - 'agent-factory/governance/a0-decisions/**'
      - '.github/workflows/run-009-d0-handoff.yml'
  workflow_dispatch:

jobs:
  validate-run-009-d0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: A0 constitutional guard
        run: node agent-factory/governance/a0-guard.cjs --base-ref origin/${{ github.base_ref || 'master' }} --head-ref HEAD
      - name: Run D0 no-send/no-money handoff tests
        run: node --test agent-factory/run-009/tests/d0-commercial-handoff.test.cjs
