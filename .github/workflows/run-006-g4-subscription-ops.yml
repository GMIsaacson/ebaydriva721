name: Run 006 subscription operations G4

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agent-factory/run-006/**"
      - "package.json"
      - ".github/workflows/run-006-g4-subscription-ops.yml"

permissions:
  contents: read

concurrency:
  group: run-006-g4-subscription-ops
  cancel-in-progress: false

jobs:
  policy-and-package:
    name: Policy, tests, package and application build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:run006
      - run: npm run validate:run006
      - name: Produce deterministic demonstration evidence
        run: npm run demo:run006 > /tmp/run-006-demo.json
      - run: node node_modules/vite/bin/vite.js build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-006-policy-and-demo-evidence
          path: |
            /tmp/run-006-demo.json
            agent-factory/run-006/fixtures/synthetic-baseline.json
          if-no-files-found: error
          retention-days: 30

  inactive-n8n:
    name: Isolated inactive n8n validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated n8n 2.34.6
        run: |
          docker volume create run006_n8n_data
          docker run --detach --name run006-n8n \
            --publish 127.0.0.1:5678:5678 \
            --volume run006_n8n_data:/home/node/.n8n \
            --volume "$PWD:/repo:ro" \
            --env N8N_DIAGNOSTICS_ENABLED=false \
            --env N8N_VERSION_NOTIFICATIONS_ENABLED=false \
            --env N8N_PUBLIC_API_DISABLED=true \
            --env N8N_BLOCK_ENV_ACCESS_IN_NODE=true \
            --env N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true \
            --env N8N_SECURE_COOKIE=false \
            --env N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true \
            --env N8N_INSTANCE_OWNER_EMAIL=run006@example.invalid \
            --env N8N_INSTANCE_OWNER_FIRST_NAME=Run \
            --env N8N_INSTANCE_OWNER_LAST_NAME=006 \
            --env 'N8N_INSTANCE_OWNER_PASSWORD_HASH=$2y$10$IZUEVTXFr.vIEyT1DnyEv.juURlE9bJlkjaQJUbx0CQpifycK7L6q' \
            n8nio/n8n:2.34.6
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5678/healthz >/dev/null \
              && docker logs run006-n8n 2>&1 | grep -q "Editor is now accessible via:"; then
              exit 0
            fi
            sleep 2
          done
          docker logs run006-n8n
          exit 1
      - name: Import inactive workflow
        run: |
          # Stop the long-running n8n server before invoking the CLI against the
          # same SQLite volume. Running both concurrently can race on migrations
          # and produce SQLITE_BUSY, which makes this acceptance check flaky.
          docker stop run006-n8n
          docker run --rm --name run006-n8n-import \
            --volume run006_n8n_data:/home/node/.n8n \
            --volume "$PWD:/repo:ro" \
            --env N8N_DIAGNOSTICS_ENABLED=false \
            --env N8N_VERSION_NOTIFICATIONS_ENABLED=false \
            --env N8N_PUBLIC_API_DISABLED=true \
            --env N8N_BLOCK_ENV_ACCESS_IN_NODE=true \
            --env N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true \
            n8nio/n8n:2.34.6 import:workflow \
            --input=/repo/agent-factory/run-006/n8n/run-006-subscription-baseline.workflow.json \
            --activeState=false
      - name: Execute and validate internal result
        run: |
          docker run --rm --name run006-n8n-cli \
            --volume run006_n8n_data:/home/node/.n8n \
            --volume "$PWD:/repo:ro" \
            --env N8N_DIAGNOSTICS_ENABLED=false \
            --env N8N_VERSION_NOTIFICATIONS_ENABLED=false \
            --env N8N_PUBLIC_API_DISABLED=true \
            --env N8N_BLOCK_ENV_ACCESS_IN_NODE=true \
            --env N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true \
            n8nio/n8n:2.34.6 execute --id=RUN006G4SUBOPS --rawOutput \
            > /tmp/run-006-n8n-execution.json
          node agent-factory/run-006/scripts/validate-n8n-execution.cjs /tmp/run-006-n8n-execution.json
      - name: Verify inactive export
        run: |
          docker run --rm --name run006-n8n-export \
            --volume run006_n8n_data:/home/node/.n8n \
            --volume /tmp:/evidence \
            --env N8N_DIAGNOSTICS_ENABLED=false \
            --env N8N_VERSION_NOTIFICATIONS_ENABLED=false \
            --env N8N_PUBLIC_API_DISABLED=true \
            --env N8N_BLOCK_ENV_ACCESS_IN_NODE=true \
            --env N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true \
            n8nio/n8n:2.34.6 export:workflow \
            --id=RUN006G4SUBOPS \
            --output=/evidence/run-006-n8n-export.json
          node -e 'const fs=require("node:fs"); const raw=JSON.parse(fs.readFileSync("/tmp/run-006-n8n-export.json","utf8")); const workflow=Array.isArray(raw)?raw[0]:raw; if(workflow.active!==false) throw new Error("workflow activated"); if((workflow.nodes||[]).some((node)=>node.credentials)) throw new Error("credentials added"); process.stdout.write(JSON.stringify({result:"Pass",id:workflow.id,active:workflow.active,nodes:workflow.nodes.length,credentials:0})+"\n");'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-006-inactive-n8n-evidence
          path: |
            /tmp/run-006-n8n-execution.json
            /tmp/run-006-n8n-export.json
          if-no-files-found: warn
          retention-days: 30
      - name: Destroy isolated n8n environment
        if: always()
        run: |
          docker rm --force run006-n8n-import run006-n8n-cli run006-n8n-export || true
          docker rm --force run006-n8n || true
          docker volume rm run006_n8n_data || true
