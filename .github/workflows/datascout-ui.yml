name: DataScout UI validation

on:
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/datascout-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Vite production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
