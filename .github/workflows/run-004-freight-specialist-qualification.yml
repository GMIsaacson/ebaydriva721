name: Run 004 Freight Specialist Qualification

on:
  pull_request:
    branches: [master]
    paths:
      - 'agent-factory/run-004/calibration/**'
      - 'agent-factory/run-004/contracts/freight-specialist-calibration-receipt.schema.json'
      - 'agent-factory/run-004/runtime/freight-specialist-qualification.cjs'
      - 'agent-factory/run-004/tests/freight-specialist-qualification.test.cjs'
      - 'agent-factory/run-004/tests/freight-q3-reviewer-qualification.test.cjs'
      - 'agent-factory/governance/specialist-registry-v1.0.json'
      - 'agent-factory/governance/a0-decisions/A0-SOURCEMARGIN-RESOLVER-EXEC-001.a0.json'
      - 'agent-factory/governance/a0-decisions/A0-SOURCEMARGIN-FREIGHT-Q3-001.a0.json'
      - 'agent-factory/governance/a0-decisions/A0-SOURCEMARGIN-FREIGHT-QUALIFY-001.a0.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run freight qualification tests
        run: node --test agent-factory/run-004/tests/freight-specialist-qualification.test.cjs agent-factory/run-004/tests/freight-q3-reviewer-qualification.test.cjs
      - name: Validate program and registry remain fail-closed
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const program=JSON.parse(fs.readFileSync('agent-factory/run-004/calibration/freight-specialist-qualification-v1.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('agent-factory/governance/specialist-registry-v1.0.json','utf8'));
          const s=registry.records.find(x=>x.specialistId==='SPC-FREIGHT-001');
          const reviewerProgram=JSON.parse(fs.readFileSync('agent-factory/run-004/calibration/freight-q3-reviewer-qualification-v1.json','utf8'));
          const reviewer=registry.records.find(x=>x.specialistId==='SPC-FREIGHT-Q3-001');
          if(!s) throw new Error('SPC-FREIGHT-001 missing');
          if(s.qualificationProgramId!==program.programId) throw new Error('Qualification program mismatch');
          if(program.authority.maxExternalActions!==0 || program.authority.maxSpendCents!==0 || program.authority.productionMutation!==false) throw new Error('Authority expanded');
          if(program.stageC.automaticPromotion!==false) throw new Error('QUALIFIED promotion must be manual/Q3-gated');
          const p=program.progress||{};
          const stageBPass=Number(p.passingCases||0)>=Number(program.stageB.minimumCases||0) && Number(p.q2PassingCases||0)===Number(p.passingCases||0) && p.caseMix?.satisfied===true;
          const c=p.stageCProgress||{};
          const stageCPass=Number(c.totalCases||0)>=Number(program.stageC.minimumTotalCases||0) && Number(c.realQuoteOrFinalChargeCases||0)>=Number(program.stageC.minimumRealQuoteOrFinalChargeCases||0) && c.independentQ3==='PE_PASS' && c.q3Q2Audit==='PASS' && c.promotionEvidenceStatus==='COMPLETE';
          if(stageCPass && s.qualificationState!=='QUALIFIED') throw new Error('Stage C passed but registry not QUALIFIED');
          if(!stageCPass && stageBPass && s.qualificationState!=='PROVISIONAL') throw new Error('Stage B passed but registry not PROVISIONAL');
          if(!stageBPass && s.qualificationState!=='UNPROVEN') throw new Error('Premature specialist promotion');
          if(s.qualificationState==='PROVISIONAL'){
            for(const x of program.stageB.allowedTaskClassesAfterPass){ if(!s.allowedTaskClasses.includes(x)) throw new Error('Missing provisional task class: '+x); }
            for(const x of program.stageB.stillExcluded){ if(!s.excludedTaskClasses.includes(x)) throw new Error('Missing provisional exclusion: '+x); }
          }
          if(s.qualificationState==='QUALIFIED' && !stageCPass) throw new Error('QUALIFIED without Stage C + Q3');
          if(s.qualificationState==='QUALIFIED'){
            if(!s.allowedTaskClasses.includes('landed-cost-professional-certification')) throw new Error('Qualified certification task class missing');
            for(const x of ['independent-review','customs-legal-opinion','tax-advice','production-mutation','publication','purchase']){ if(!s.excludedTaskClasses.includes(x)) throw new Error('Qualified exclusion missing: '+x); }
            if(s.eligibleAsReviewer!==false) throw new Error('Authoring specialist may not become its own Q3 reviewer');
          }
          if(!reviewer) throw new Error('SPC-FREIGHT-Q3-001 missing');
          if(reviewerProgram.qualificationResult!=='QUALIFIED') throw new Error('Reviewer program not qualified');
          if(reviewerProgram.aggregateQ2?.result!=='QUALIFICATION_Q2_PASS') throw new Error('Reviewer Q2 qualification missing');
          if(reviewer.qualificationState!=='QUALIFIED' || reviewer.eligibleAsReviewer!==true) throw new Error('Reviewer registry state invalid');
          if(!reviewer.allowedTaskClasses.includes('Q3-freight-review')) throw new Error('Reviewer task class missing');
          for(const x of ['freight-authoring','self-review','production-mutation']){ if(!reviewer.excludedTaskClasses.includes(x)) throw new Error('Reviewer independence exclusion missing: '+x); }
          console.log('Freight qualification state is evidence-derived and fail-closed:',s.qualificationState,'reviewer:',reviewer.qualificationState);
          NODE
