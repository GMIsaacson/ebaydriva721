name: A0 Constitutional Guard

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  a0-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run A0 guard tests
        run: node --test agent-factory/governance/a0-guard.test.cjs

      - name: Enforce A0 structural gate
        run: node agent-factory/governance/a0-guard.cjs --base "origin/${{ github.base_ref }}"
