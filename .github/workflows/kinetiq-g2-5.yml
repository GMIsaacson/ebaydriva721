name: Kinetiq G2.5 Professional Capability

on:
  pull_request:
    paths:
      - 'agent-factory/kinetiq/**'
      - 'agent-factory/core/professional-capability-gate.cjs'
      - 'agent-factory/governance/a0-decisions/A0-KINETIQ-G25-001.a0.json'
      - '.github/workflows/kinetiq-g2-5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kinetiq-g25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate active Kinetiq professional capability or confirm paused state
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('agent-factory/kinetiq/team-manifest.json', 'utf8'));
          if (manifest.lifecycle === 'Paused') {
            if (manifest.authority?.externalActions !== 0 || manifest.authority?.deploy !== false || manifest.authority?.publish !== false || manifest.authority?.message !== false) {
              throw new Error('Paused Kinetiq must retain zero execution authority');
            }
            console.log('Kinetiq is Paused; active G2.5 promotion test is not applicable. Historical design evidence is preserved.');
            process.exit(0);
          }
          NODE
          if [ "$(node -p "require('./agent-factory/kinetiq/team-manifest.json').lifecycle")" != "Paused" ]; then
            node --test agent-factory/kinetiq/tests/g2-5-professional-capability.test.cjs
          fi
